<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Evolução da Curva DI · Widget Fundos</title>
<link rel="stylesheet" href="evolucao-di-fundos.css?v=1.0.0">
</head>
<body>
<main class="widget" id="widget">
  <header class="head">
    <div>
      <p class="eyebrow">HISTÓRICO · CURVA DI</p>
      <h1>Como a curva de juros mudou</h1>
      <p class="subtitle">Compare a curva atual com janelas anteriores nos mesmos prazos.</p>
    </div>
    <div class="status">
      <strong id="mode">carregando</strong>
      <span id="date">—</span>
    </div>
  </header>

  <section class="insight">
    <div class="insightText">
      <span>LEITURA AUTOMÁTICA</span>
      <strong id="reading">Carregando dados…</strong>
    </div>
    <span id="direction" class="direction flat">—</span>
  </section>

  <section class="controls">
    <div>
      <span>Comparar com</span>
      <div class="buttons">
        <button data-period="5d">1 semana</button>
        <button data-period="1m">1 mês</button>
        <button data-period="3m" class="active">3 meses</button>
        <button data-period="6m" class="active">6 meses</button>
        <button data-period="1y">1 ano</button>
      </div>
    </div>
    <small id="count">—</small>
  </section>

  <div id="legend" class="legend"></div>
  <div id="chart" class="chart" aria-label="Evolução histórica da Curva DI"></div>

  <footer>
    <span>Fonte: B3 · coleta e parsing via PYield · normalização flat-forward</span>
    <span>A curva atual permanece sempre visível.</span>
  </footer>
</main>
<script src="evolucao-di-fundos.js?v=1.0.0" defer></script>
</body>
</html>
