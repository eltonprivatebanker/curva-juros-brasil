name: Atualizar curva DI

on:
  workflow_dispatch:
  schedule:
    # 22:30 de segunda a sexta no horário de Brasília (01:30 UTC do dia seguinte)
    - cron: "30 1 * * 2-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      - name: Buscar DI mais recente
        run: python scripts/update_di.py --latest

      - name: Commit dos dados
        run: |
          if git diff --quiet -- data/; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Atualiza curva DI"
          git push
