name: Atualizar Tesouro Direto

on:
  workflow_dispatch:
  schedule:
    - cron: "10 2 * * 2-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar Tesouro Direto
        run: python scripts/update_tesouro.py --latest
      - name: Commit
        run: |
          if git diff --quiet -- data/tesouro/; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tesouro/
          git commit -m "Atualiza Tesouro Direto"
          git push
