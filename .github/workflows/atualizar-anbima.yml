name: Atualizar ANBIMA ETTJ

on:
  workflow_dispatch:
  schedule:
    - cron: "50 1 * * 2-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar ANBIMA
        env:
          ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID }}
          ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET }}
        run: python scripts/update_anbima.py --latest --skip-if-no-credentials
      - name: Commit
        run: |
          if git diff --quiet -- data/anbima/; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anbima/
          git commit -m "Atualiza curva ANBIMA"
          git push
