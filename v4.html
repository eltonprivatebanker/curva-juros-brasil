  <div class="v4Loader"><div><strong>Carregando Juros Brasil · V4</strong><span>Base V3 + comparador líquido + conversor de taxa equivalente</span></div></div>
  <script>
    (async()=>{
      try{
        const r=await fetch('./v3.html',{cache:'no-store'});
        if(!r.ok)throw new Error(`v3.html: HTTP ${r.status}`);
        let html=await r.text();
        const css = "/* Juros Brasil · V4.0 — comparador líquido LCI IPCA+ × Tesouro IPCA+ */\n:root{\n  --v4-blue:#69b7ff;\n  --v4-green:#38d39f;\n  --v4-gold:#ffc96b;\n  --v4-border:rgba(255,255,255,.09);\n  --v4-soft:rgba(255,255,255,.035);\n}\n\n.v4Build{margin-left:.55rem;opacity:.62;font-size:.72rem;white-space:nowrap}\n.v4HeroBadge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(56,211,159,.28);border-radius:999px;background:rgba(56,211,159,.07);color:#88e7c7;font-size:.7rem;font-weight:850;letter-spacing:.05em;text-transform:uppercase}\n.v4TreasuryCompare{border-color:rgba(56,211,159,.24);background:radial-gradient(circle at 8% 0%,rgba(56,211,159,.075),transparent 30%),var(--panel,#0c1d2d)}\n.v4TreasuryCompare .panelHead{align-items:flex-start}\n.v4TreasuryCompare h2{margin-bottom:5px}\n.v4TreasuryCompare .sectionSubtitle{max-width:900px}\n\n.v4InputGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}\n.v4InputGrid label{display:flex;flex-direction:column;gap:7px;color:var(--muted,#9fb2c6);font-size:.75rem;font-weight:750}\n.v4InputGrid input,.v4InputGrid select{width:100%;min-height:42px;box-sizing:border-box;border:1px solid #29445d;border-radius:9px;background:#091827;color:#f2f6fb;padding:9px 10px;font:inherit;font-size:.84rem;outline:none}\n.v4InputGrid input:focus,.v4InputGrid select:focus{border-color:#5387b2;box-shadow:0 0 0 3px rgba(105,183,255,.07)}\n.v4InputGrid input[readonly]{opacity:.76;background:#0b1621;cursor:not-allowed}\n.v4InputPrefix,.v4InputSuffix{display:flex;align-items:center;border:1px solid #29445d;border-radius:9px;background:#091827;overflow:hidden}\n.v4InputPrefix:focus-within,.v4InputSuffix:focus-within{border-color:#5387b2;box-shadow:0 0 0 3px rgba(105,183,255,.07)}\n.v4InputPrefix span,.v4InputSuffix span{flex:0 0 auto;padding:0 10px;color:#8ea6bc;font-size:.72rem;white-space:nowrap}\n.v4InputPrefix input,.v4InputSuffix input{border:0;border-radius:0;background:transparent;box-shadow:none!important}\n\n.v4MarketStrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:16px}\n.v4MarketStrip article{padding:12px;border:1px solid var(--v4-border);border-radius:11px;background:var(--v4-soft);min-width:0}\n.v4MarketStrip span{display:block;color:#8ea6bc;font-size:.69rem;font-weight:800;text-transform:uppercase;letter-spacing:.045em}\n.v4MarketStrip strong{display:block;margin-top:6px;color:#f4f8fc;font-size:1rem;line-height:1.25;overflow-wrap:anywhere}\n.v4MarketStrip small{display:block;margin-top:5px;color:#7f95aa;font-size:.69rem;line-height:1.35}\n\n.v4ResultGrid{display:grid;grid-template-columns:1fr 1fr .82fr;gap:12px;margin-top:16px}\n.v4ResultCard{position:relative;padding:16px;border:1px solid var(--v4-border);border-radius:14px;background:rgba(255,255,255,.025);min-width:0}\n.v4ResultCard.v4Leader{border-color:rgba(56,211,159,.4);background:linear-gradient(180deg,rgba(56,211,159,.07),rgba(56,211,159,.018))}\n.v4ResultHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n.v4ResultHead span{color:#8fc8ff;font-size:.72rem;font-weight:850;text-transform:uppercase;letter-spacing:.05em}\n.v4ResultHead em{font-style:normal;color:#88e7c7;font-size:.65rem;font-weight:850;text-transform:uppercase;white-space:nowrap}\n.v4Rate{display:block;margin-top:8px;color:#f2f6fb;font-size:1.16rem;line-height:1.25}\n.v4NetValue{margin-top:12px;color:#fff;font-size:1.58rem;font-weight:850;letter-spacing:-.02em}\n.v4MetaList{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}\n.v4MetaList div{padding:8px 9px;border-radius:9px;background:rgba(255,255,255,.035)}\n.v4MetaList span{display:block;color:#8197ab;font-size:.65rem;text-transform:uppercase;letter-spacing:.035em}\n.v4MetaList b{display:block;margin-top:3px;color:#dce8f4;font-size:.78rem}\n.v4ResultCard>small{display:block;margin-top:11px;color:#8298ad;font-size:.7rem;line-height:1.45}\n\n.v4WinnerCard{display:flex;flex-direction:column;justify-content:center;text-align:center;border-color:rgba(255,201,107,.24);background:linear-gradient(180deg,rgba(255,201,107,.055),rgba(255,201,107,.012))}\n.v4WinnerCard .v4Difference{margin-top:7px;color:#fff;font-size:1.35rem;font-weight:850}\n.v4WinnerCard .v4WinnerName{margin-top:4px;color:#ffc96b;font-size:.93rem;font-weight:800}\n.v4WinnerCard .v4WinnerNote{margin-top:10px;color:#8298ad;font-size:.72rem;line-height:1.45}\n\n.v4BreakGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}\n.v4BreakGrid article{padding:13px;border:1px solid var(--v4-border);border-radius:11px;background:rgba(255,255,255,.025)}\n.v4BreakGrid span{display:block;color:#8ea6bc;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}\n.v4BreakGrid strong{display:block;margin-top:6px;color:#fff;font-size:1.04rem}\n.v4BreakGrid small{display:block;margin-top:5px;color:#7f95aa;font-size:.69rem;line-height:1.4}\n\n.v4Reading{margin-top:14px;padding:14px 15px;border:1px solid rgba(105,183,255,.15);border-radius:11px;background:rgba(105,183,255,.035);color:#b9cadb;font-size:.78rem;line-height:1.62}\n.v4Reading p{margin:0}.v4Reading p+p{margin-top:7px}.v4Reading strong{color:#f2f6fb}\n.v4Caution{color:#8fa5b9!important}\n\n.v4SensitivityWrap{margin-top:14px;overflow:auto;border:1px solid var(--v4-border);border-radius:11px}\n.v4Sensitivity{width:100%;border-collapse:collapse;min-width:660px}\n.v4Sensitivity th,.v4Sensitivity td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right;font-size:.74rem;white-space:nowrap}\n.v4Sensitivity th:first-child,.v4Sensitivity td:first-child{text-align:left}\n.v4Sensitivity th{color:#8ea6bc;background:rgba(255,255,255,.025);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}\n.v4Sensitivity td{color:#d8e4ef}.v4Sensitivity tr:last-child td{border-bottom:0}\n.v4Sensitivity tr.v4MarketRow td{background:rgba(105,183,255,.045)}\n.v4Positive{color:#88e7c7!important}.v4Negative{color:#ff9d9d!important}.v4Neutral{color:#c9d7e3!important}\n\n.v4Method{margin-top:13px}\n.v4Method summary{cursor:pointer;color:#8fc8ff;font-size:.76rem;font-weight:800}\n.v4Method p,.v4Method li{color:#8da3b7;font-size:.73rem;line-height:1.55}\n.v4Method ul{margin:8px 0 0;padding-left:18px}\n\n.v4ScenarioTabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07)}\n.v4ScenarioTabs button{border:1px solid #29445d;border-radius:9px;background:#0b1928;color:#9fb2c6;padding:8px 11px;font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}\n.v4ScenarioTabs button.active{border-color:rgba(56,211,159,.38);background:rgba(56,211,159,.09);color:#dffff4}\n.v4LegacyDecisionHidden{display:none!important}\n\n@media(max-width:1050px){\n  .v4InputGrid{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .v4MarketStrip{grid-template-columns:repeat(3,minmax(0,1fr))}\n  .v4ResultGrid{grid-template-columns:1fr 1fr}.v4WinnerCard{grid-column:1/-1}\n}\n@media(max-width:700px){\n  .v4InputGrid,.v4ResultGrid,.v4BreakGrid,.v4MarketStrip{grid-template-columns:1fr}\n  .v4WinnerCard{grid-column:auto}\n  .v4MetaList{grid-template-columns:1fr}\n  .v4TreasuryCompare .panelHead{gap:10px}\n}\n\n\n/* V4.1 · moeda e conversor de taxa equivalente */\n.v4InputPrefix input[data-money=\"brl\"]{font-variant-numeric:tabular-nums;font-weight:800}\n.v4Converter{margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}\n.v4ConverterHead{align-items:center!important}\n.v4ConverterGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}\n.v4ConverterGrid label{display:flex;flex-direction:column;gap:7px;color:var(--muted,#9fb2c6);font-size:.75rem;font-weight:750}\n.v4ConverterGrid input,.v4ConverterGrid select{width:100%;min-height:42px;box-sizing:border-box;border:1px solid #29445d;border-radius:9px;background:#091827;color:#f2f6fb;padding:9px 10px;font:inherit;font-size:.84rem;outline:none}\n.v4ConverterGrid .v4InputSuffix input{border:0;border-radius:0;background:transparent}\n.v4ConvResult{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}\n.v4ConvResult article{padding:13px;border:1px solid var(--v4-border);border-radius:11px;background:rgba(255,255,255,.025)}\n.v4ConvResult span{display:block;color:#8ea6bc;font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}\n.v4ConvResult strong{display:block;margin-top:6px;color:#f4f8fc;font-size:1.04rem}\n.v4ConvResult small{display:block;margin-top:5px;color:#7f95aa;font-size:.69rem;line-height:1.4}\n.v4ConvResult .v4ConvMain{border-color:rgba(56,211,159,.32);background:rgba(56,211,159,.055)}\n.v4ConvResult .v4ConvMain strong{color:#88e7c7;font-size:1.18rem}\n.v4IrGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}\n.v4IrGrid article{padding:10px 11px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.018)}\n.v4IrGrid span{display:block;color:#7f95aa;font-size:.66rem}.v4IrGrid strong{display:block;margin-top:3px;color:#c9d7e3;font-size:.9rem}\n.v4IrGrid article.active{border-color:rgba(255,201,107,.38);background:rgba(255,201,107,.07)}\n.v4IrGrid article.active span,.v4IrGrid article.active strong{color:#ffd98e}\n.v4ConverterNote{margin:12px 0 0;padding:12px 13px;border-left:3px solid rgba(105,183,255,.45);background:rgba(105,183,255,.035);border-radius:0 9px 9px 0;color:#9fb2c6;font-size:.74rem;line-height:1.55}\n.v4ConverterNote strong{color:#eaf2fb}\n@media(max-width:1050px){.v4ConverterGrid,.v4ConvResult,.v4IrGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:700px){.v4ConverterGrid,.v4ConvResult,.v4IrGrid{grid-template-columns:1fr}.v4ConverterHead{align-items:flex-start!important}.v4ConverterHead button{width:100%}}\n";
        const js = "/* Juros Brasil · V4.0 — comparador líquido LCI IPCA+ × Tesouro IPCA+ */\n(() => {\n  const $ = (id) => document.getElementById(id);\n  const cache = new Map();\n  const VERSION = 'V4.1.0 · teste';\n  const DEFAULT_CUSTODY = 0.20;\n\n  const finite = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));\n  function parseBrlMoney(value){\n    if(value===null||value===undefined) return NaN;\n    let s=String(value).trim().replace(/R\\$\\s?/g,'').replace(/\\s/g,'');\n    if(!s) return NaN;\n    if(s.includes(',')) s=s.replace(/\\./g,'').replace(',','.');\n    else s=s.replace(/[^0-9.-]/g,'');\n    const v=Number(s);\n    return Number.isFinite(v)?v:NaN;\n  }\n  const num = (id) => {\n    const el=$(id);\n    if(!el) return NaN;\n    const v=el.dataset.money==='brl' ? parseBrlMoney(el.value) : parseFloat(el.value);\n    return Number.isFinite(v) ? v : NaN;\n  };\n  function formatMoneyInput(el){\n    if(!el) return;\n    const v=parseBrlMoney(el.value);\n    if(Number.isFinite(v)) el.value=v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\n  }\n  const money = (v) => Number.isFinite(v)\n    ? v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})\n    : '—';\n  const pct = (v,d=2) => Number.isFinite(v)\n    ? `${v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}%`\n    : '—';\n  const bps = (v) => Number.isFinite(v)\n    ? `${v>0?'+':''}${v.toLocaleString('pt-BR',{maximumFractionDigits:1})} bps`\n    : '—';\n  const dateBr = (iso) => {\n    if(!iso) return '—';\n    const [y,m,d] = iso.split('-');\n    return `${d}/${m}/${y}`;\n  };\n  const approxHorizon = (du) => {\n    if(!Number.isFinite(du)) return '—';\n    const years = du/252;\n    if(years < .95) return `${Math.round(years*12)}M`;\n    return `${years.toLocaleString('pt-BR',{maximumFractionDigits:1})}A`;\n  };\n\n  async function getJson(path){\n    if(cache.has(path)) return cache.get(path);\n    const p = fetch(path,{cache:'no-store'}).then(r=>{\n      if(!r.ok) throw new Error(`${path}: HTTP ${r.status}`);\n      return r.json();\n    });\n    cache.set(path,p);\n    return p;\n  }\n\n  function flatForward(points,targetDu){\n    const pts=(points||[])\n      .filter(p=>finite(p.du)&&finite(p.rate)&&+p.du>0)\n      .map(p=>({du:+p.du,rate:+p.rate}))\n      .sort((a,b)=>a.du-b.du);\n    const exact=pts.find(p=>p.du===targetDu);\n    if(exact) return exact.rate;\n    const left=[...pts].reverse().find(p=>p.du<targetDu);\n    const right=pts.find(p=>p.du>targetDu);\n    if(!left||!right||targetDu<=0) return NaN;\n    const t1=left.du/252,t2=right.du/252,t=targetDu/252;\n    const ldf1=-t1*Math.log1p(left.rate/100);\n    const ldf2=-t2*Math.log1p(right.rate/100);\n    const w=(t-t1)/(t2-t1);\n    const ldf=ldf1+w*(ldf2-ldf1);\n    return Math.expm1(-ldf/t)*100;\n  }\n\n  function annualIpcaPlus(ipca,realSpread){\n    if(!Number.isFinite(ipca)||!Number.isFinite(realSpread)) return NaN;\n    return ((1+ipca/100)*(1+realSpread/100)-1)*100;\n  }\n\n  function irRateByCalendarDays(days){\n    if(!Number.isFinite(days)) return NaN;\n    if(days<=180) return 22.5;\n    if(days<=360) return 20;\n    if(days<=720) return 17.5;\n    return 15;\n  }\n\n  function calendarDays(a,b){\n    const x=Date.parse(`${a}T00:00:00Z`),y=Date.parse(`${b}T00:00:00Z`);\n    return Number.isFinite(x)&&Number.isFinite(y) ? Math.max(0,Math.round((y-x)/86400000)) : NaN;\n  }\n\n  function investmentModel({amount,ipca,spread,du,taxed=false,irPct=0,custodyPct=0,agentPct=0}){\n    const years=du/252;\n    const nominal=annualIpcaPlus(ipca,spread);\n    const gross=amount*Math.pow(1+nominal/100,years);\n    const grossGain=Math.max(0,gross-amount);\n    const tax=taxed ? grossGain*(irPct/100) : 0;\n    const feeAnnual=Math.max(0,custodyPct)+Math.max(0,agentPct);\n    const afterFeeFactor=feeAnnual>0 ? Math.pow(Math.max(0,1-feeAnnual/100),years) : 1;\n    const afterFees=gross*afterFeeFactor;\n    const fees=Math.max(0,gross-afterFees);\n    const net=afterFees-tax;\n    const netAnnual=years>0 ? (Math.pow(net/amount,1/years)-1)*100 : NaN;\n    const netReal=Number.isFinite(netAnnual)&&Number.isFinite(ipca)\n      ? ((1+netAnnual/100)/(1+ipca/100)-1)*100\n      : NaN;\n    return {years,nominal,gross,grossGain,tax,fees,net,netAnnual,netReal,feeAnnual};\n  }\n\n  function solveTreasurySpread(targetNet,{amount,ipca,du,irPct,custodyPct,agentPct}){\n    let lo=-5,hi=35;\n    const f=(spread)=>investmentModel({amount,ipca,spread,du,taxed:true,irPct,custodyPct,agentPct}).net-targetNet;\n    if(f(lo)>0) return lo;\n    if(f(hi)<0) return NaN;\n    for(let i=0;i<80;i++){\n      const mid=(lo+hi)/2;\n      if(f(mid)>=0) hi=mid; else lo=mid;\n    }\n    return (lo+hi)/2;\n  }\n\n  function solveLciSpread(targetNet,{amount,ipca,du}){\n    let lo=-5,hi=35;\n    const f=(spread)=>investmentModel({amount,ipca,spread,du}).net-targetNet;\n    if(f(lo)>0) return lo;\n    if(f(hi)<0) return NaN;\n    for(let i=0;i<80;i++){\n      const mid=(lo+hi)/2;\n      if(f(mid)>=0) hi=mid; else lo=mid;\n    }\n    return (lo+hi)/2;\n  }\n\n  function taxedNominalNetFactor(ratePct,years,irPct,costPct=0){\n    if(![ratePct,years,irPct,costPct].every(Number.isFinite)||years<=0) return NaN;\n    const gross=Math.pow(1+ratePct/100,years);\n    const tax=Math.max(0,gross-1)*(irPct/100);\n    const afterCost=gross*Math.pow(Math.max(0,1-costPct/100),years);\n    return afterCost-tax;\n  }\n\n  function exemptNetFactor(ratePct,years){\n    if(!Number.isFinite(ratePct)||!Number.isFinite(years)||years<=0) return NaN;\n    return Math.pow(1+ratePct/100,years);\n  }\n\n  function solveTaxableEquivalent(exemptRatePct,years,irPct,costPct=0){\n    const target=exemptNetFactor(exemptRatePct,years);\n    if(!Number.isFinite(target)) return NaN;\n    let lo=-5,hi=80;\n    const f=r=>taxedNominalNetFactor(r,years,irPct,costPct)-target;\n    if(f(lo)>=0) return lo;\n    if(f(hi)<0) return NaN;\n    for(let i=0;i<90;i++){\n      const mid=(lo+hi)/2;\n      if(f(mid)>=0) hi=mid; else lo=mid;\n    }\n    return (lo+hi)/2;\n  }\n\n  function solveExemptEquivalent(taxableRatePct,years,irPct,costPct=0){\n    const target=taxedNominalNetFactor(taxableRatePct,years,irPct,costPct);\n    if(!Number.isFinite(target)||target<=0) return NaN;\n    return (Math.pow(target,1/years)-1)*100;\n  }\n\n  function irBracketLabel(days){\n    if(!Number.isFinite(days)) return '—';\n    if(days<=180) return 'Até 180 dias';\n    if(days<=360) return '181 a 360 dias';\n    if(days<=720) return '361 a 720 dias';\n    return 'Acima de 720 dias';\n  }\n\n  function buildModule(){\n    const tab=$('tab-decisao');\n    const intro=tab?.querySelector('.decisionIntro');\n    if(!tab||!intro||$('v4TreasuryCompare')) return;\n\n    const tabs=document.createElement('div');\n    tabs.className='v4ScenarioTabs';\n    tabs.innerHTML=`\n      <button type=\"button\" class=\"active\" data-v4-view=\"treasury\">LCI IPCA+ × Tesouro IPCA+</button>\n      <button type=\"button\" data-v4-view=\"legacy\">LCI Pós × Pré × IPCA+</button>`;\n    intro.after(tabs);\n\n    const section=document.createElement('section');\n    section.id='v4TreasuryCompare';\n    section.className='panel v4TreasuryCompare';\n    section.innerHTML=`\n      <div class=\"panelHead\">\n        <div>\n          <p class=\"eyebrow\">V4 · COMPARADOR LÍQUIDO</p>\n          <h2>LCI IPCA+ × Tesouro IPCA+</h2>\n          <p class=\"sectionSubtitle\">Compare as duas estruturas no mesmo horizonte, carregadas até o vencimento. O Tesouro considera IR regressivo e uma aproximação da taxa de custódia B3; a LCI PF é tratada como isenta de IR.</p>\n        </div>\n        <span class=\"v4HeroBadge\">novo · teste</span>\n      </div>\n\n      <div class=\"v4InputGrid\">\n        <label>Valor da aplicação\n          <div class=\"v4InputPrefix\"><span>R$</span><input id=\"v4Amount\" type=\"text\" inputmode=\"decimal\" data-money=\"brl\" value=\"100.000,00\" aria-label=\"Valor da aplicação em reais\"></div>\n        </label>\n        <label>LCI IPCA+\n          <div class=\"v4InputSuffix\"><input id=\"v4LciSpread\" type=\"number\" min=\"0\" max=\"30\" step=\"0.01\" value=\"7.00\"><span>% a.a.</span></div>\n        </label>\n        <label>Tesouro IPCA+ selecionado\n          <select id=\"v4TreasuryTitle\"><option>Carregando títulos…</option></select>\n        </label>\n        <label>Cenário de IPCA\n          <select id=\"v4IpcaMode\"><option value=\"market\" selected>Mercado · ANBIMA implícita</option><option value=\"custom\">Personalizado</option></select>\n        </label>\n        <label>IPCA equivalente\n          <div class=\"v4InputSuffix\"><input id=\"v4Ipca\" type=\"number\" min=\"-5\" max=\"30\" step=\"0.01\" value=\"5.00\" readonly><span>% a.a.</span></div>\n        </label>\n        <label>Custódia B3\n          <div class=\"v4InputSuffix\"><input id=\"v4Custody\" type=\"number\" min=\"0\" max=\"5\" step=\"0.01\" value=\"${DEFAULT_CUSTODY.toFixed(2)}\"><span>% a.a.</span></div>\n        </label>\n        <label>Taxa da instituição\n          <div class=\"v4InputSuffix\"><input id=\"v4AgentFee\" type=\"number\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0.00\"><span>% a.a.</span></div>\n        </label>\n        <label>Taxa Tesouro IPCA+\n          <div class=\"v4InputSuffix\"><input id=\"v4TreasuryRate\" type=\"number\" step=\"0.01\" readonly><span>% a.a.</span></div>\n        </label>\n      </div>\n\n      <div id=\"v4MarketStrip\" class=\"v4MarketStrip\"></div>\n      <div id=\"v4ResultGrid\" class=\"v4ResultGrid\"></div>\n      <div id=\"v4BreakGrid\" class=\"v4BreakGrid\"></div>\n      <div id=\"v4Reading\" class=\"v4Reading\"></div>\n\n      <div class=\"panelHead\" style=\"margin-top:20px\">\n        <div><p class=\"eyebrow\">SENSIBILIDADE</p><h2>Quanto o Tesouro precisa pagar para empatar?</h2><p class=\"sectionSubtitle\">A taxa de equilíbrio muda com a inflação porque o IR do Tesouro incide sobre o rendimento nominal total.</p></div>\n      </div>\n      <div class=\"v4SensitivityWrap\"><table class=\"v4Sensitivity\"><thead><tr><th>IPCA do cenário</th><th>Tesouro IPCA+ de equilíbrio</th><th>Tesouro atual − equilíbrio</th><th>Maior líquido</th></tr></thead><tbody id=\"v4Sensitivity\"></tbody></table></div>\n\n      <section class=\"v4Converter\">\n        <div class=\"panelHead v4ConverterHead\">\n          <div><p class=\"eyebrow\">CONVERSOR DE TAXA EQUIVALENTE</p><h2>Isenta × tributável</h2><p class=\"sectionSubtitle\">Converta uma taxa anual isenta em taxa bruta tributável equivalente — ou faça o caminho inverso — usando a alíquota regressiva de IR do prazo.</p></div>\n          <button type=\"button\" id=\"v4ConvUseTreasury\" class=\"secondaryButton\">Usar prazo do Tesouro selecionado</button>\n        </div>\n        <div class=\"v4ConverterGrid\">\n          <label>Conversão\n            <select id=\"v4ConvDirection\"><option value=\"exemptToTaxed\" selected>Isenta → tributável</option><option value=\"taxedToExempt\">Tributável → isenta</option></select>\n          </label>\n          <label id=\"v4ConvRateLabel\">Taxa isenta de origem\n            <div class=\"v4InputSuffix\"><input id=\"v4ConvRate\" type=\"number\" min=\"0\" max=\"80\" step=\"0.01\" value=\"13.08\"><span>% a.a.</span></div>\n          </label>\n          <label>Prazo fiscal\n            <div class=\"v4InputSuffix\"><input id=\"v4ConvDays\" type=\"number\" min=\"1\" max=\"20000\" step=\"1\" value=\"721\"><span>dias corridos</span></div>\n          </label>\n          <label>Custo anual do tributável\n            <div class=\"v4InputSuffix\"><input id=\"v4ConvCost\" type=\"number\" min=\"0\" max=\"10\" step=\"0.01\" value=\"0.20\"><span>% a.a.</span></div>\n          </label>\n        </div>\n        <div id=\"v4ConvResult\" class=\"v4ConvResult\"></div>\n        <div id=\"v4IrGrid\" class=\"v4IrGrid\">\n          <article data-ir-max=\"180\"><span>Até 180 dias</span><strong>22,5%</strong></article>\n          <article data-ir-max=\"360\"><span>181 a 360 dias</span><strong>20,0%</strong></article>\n          <article data-ir-max=\"720\"><span>361 a 720 dias</span><strong>17,5%</strong></article>\n          <article data-ir-max=\"999999\"><span>Acima de 720 dias</span><strong>15,0%</strong></article>\n        </div>\n        <p class=\"v4ConverterNote\"><strong>Importante para IPCA+:</strong> não converta apenas o “+7%” ou o “+8%” pela alíquota de IR. No Tesouro IPCA+, o IR incide sobre o rendimento nominal total. Para comparar LCI IPCA+ com Tesouro IPCA+, use o ponto de equilíbrio do comparador acima, que incorpora o cenário de IPCA.</p>\n      </section>\n\n      <details class=\"v4Method\">\n        <summary>ⓘ Metodologia desta primeira versão</summary>\n        <ul>\n          <li>Compara apenas <strong>Tesouro IPCA+ sem juros semestrais</strong>, evitando fluxos intermediários de cupom nesta etapa.</li>\n          <li>Assume carregamento até o vencimento e usa o mesmo horizonte, em dias úteis, para modelar a LCI.</li>\n          <li>O IR do Tesouro é aplicado ao rendimento nominal modelado pela tabela regressiva. Na comparação automática, os dias corridos entre a data do snapshot e o vencimento servem como aproximação; para fins fiscais, a contagem oficial parte da liquidação da aplicação.</li>\n          <li>A custódia B3 é modelada como um custo anual sobre o valor acumulado. É uma aproximação educacional da cobrança efetiva provisionada diariamente.</li>\n          <li>Não considera IOF, compra fracionária, spread operacional, marcação a mercado em venda antecipada, risco de crédito, FGC, liquidez, reinvestimento, mudanças tributárias ou particularidades contratuais.</li>\n        </ul>\n      </details>`;\n    tabs.after(section);\n\n    // O comparador legado continua na página, mas inicia oculto na V4.\n    legacySections(tab,section,tabs).forEach(el=>el.classList.add('v4LegacyDecisionHidden'));\n\n    tabs.addEventListener('click',e=>{\n      const btn=e.target.closest('[data-v4-view]');\n      if(!btn) return;\n      tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));\n      const treasury=btn.dataset.v4View==='treasury';\n      section.classList.toggle('v4LegacyDecisionHidden',!treasury);\n      legacySections(tab,section,tabs).forEach(el=>el.classList.toggle('v4LegacyDecisionHidden',treasury));\n    });\n  }\n\n  function legacySections(tab,section,tabs){\n    return [...tab.children].filter(el=>el!==section&&el!==tabs&&!el.classList.contains('decisionIntro')&&!el.classList.contains('v31Question'));\n  }\n\n  const V = {\n    tesouroIndex:null,\n    anbimaIndex:null,\n    tesouro:null,\n    anbima:null,\n    selected:null,\n    dataDate:null,\n    anbimaDate:null\n  };\n\n  function titleLabel(t){\n    return `Tesouro IPCA+ ${String(t.maturity||'').slice(0,4)} · ${pct(+t.buy_rate_pct,2)} · ${approxHorizon(+t.business_days)}`;\n  }\n\n  async function loadMarketData(){\n    [V.tesouroIndex,V.anbimaIndex]=await Promise.all([\n      getJson('data/tesouro/index.json'),\n      getJson('data/anbima/index.json')\n    ]);\n    const latest=V.tesouroIndex?.latest || [...(V.tesouroIndex?.entries||[])].sort((a,b)=>b.date.localeCompare(a.date))[0]?.date;\n    const te=V.tesouroIndex?.entries?.find(e=>e.date===latest);\n    if(!te) throw new Error('Snapshot do Tesouro não encontrado.');\n    V.tesouro=await getJson(te.path);\n    V.dataDate=V.tesouro.date||latest;\n\n    const anbimaEntries=[...(V.anbimaIndex?.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));\n    const ae=anbimaEntries.find(e=>e.date<=V.dataDate) || anbimaEntries[0];\n    if(ae){\n      V.anbima=await getJson(ae.path);\n      V.anbimaDate=V.anbima.date||ae.date;\n    }\n\n    const titles=(V.tesouro?.titles||[])\n      .filter(t=>t.type==='Tesouro IPCA+'&&finite(t.buy_rate_pct)&&finite(t.business_days)&&+t.business_days>21)\n      .sort((a,b)=>+a.business_days-+b.business_days);\n    const select=$('v4TreasuryTitle');\n    select.innerHTML='';\n    titles.forEach((t,i)=>select.add(new Option(titleLabel(t),String(i))));\n    if(!titles.length){\n      select.add(new Option('Sem Tesouro IPCA+ comparável',''));\n      select.disabled=true;\n      throw new Error('Sem títulos Tesouro IPCA+ sem cupom no snapshot atual.');\n    }\n    select._v4Titles=titles;\n    select.value='0';\n    V.selected=titles[0];\n  }\n\n  function marketIpcaFor(du){\n    const implied=(V.anbima?.curves||[]).filter(x=>finite(x.implied_pct)).map(x=>({du:+x.du,rate:+x.implied_pct}));\n    return flatForward(implied,du);\n  }\n  function marketRealFor(du){\n    const real=(V.anbima?.curves||[]).filter(x=>finite(x.ipca_pct)).map(x=>({du:+x.du,rate:+x.ipca_pct}));\n    return flatForward(real,du);\n  }\n\n  function syncSelected(){\n    const select=$('v4TreasuryTitle');\n    const list=select?._v4Titles||[];\n    V.selected=list[+select.value]||list[0]||null;\n    if(V.selected&&$('v4TreasuryRate')) $('v4TreasuryRate').value=(+V.selected.buy_rate_pct).toFixed(2);\n    syncIpcaMode();\n  }\n\n  function syncIpcaMode(){\n    const mode=$('v4IpcaMode')?.value||'market';\n    const input=$('v4Ipca');\n    if(!input||!V.selected) return;\n    const isMarket=mode==='market';\n    input.readOnly=isMarket;\n    if(isMarket){\n      const m=marketIpcaFor(+V.selected.business_days);\n      if(Number.isFinite(m)) input.value=m.toFixed(2);\n    }\n  }\n\n  function currentInputs(){\n    const t=V.selected;\n    const amount=num('v4Amount'),lciSpread=num('v4LciSpread'),ipca=num('v4Ipca');\n    const custody=num('v4Custody'),agentFee=num('v4AgentFee');\n    const treasurySpread=t?+t.buy_rate_pct:NaN,du=t?+t.business_days:NaN;\n    const days=t?calendarDays(V.dataDate,t.maturity):NaN;\n    const irPct=irRateByCalendarDays(days);\n    return {t,amount,lciSpread,ipca,custody,agentFee,treasurySpread,du,days,irPct};\n  }\n\n  function render(){\n    if(!V.selected) return;\n    syncIpcaMode();\n    const x=currentInputs();\n    if(![x.amount,x.lciSpread,x.ipca,x.custody,x.agentFee,x.treasurySpread,x.du,x.irPct].every(Number.isFinite)) return;\n\n    const lci=investmentModel({amount:x.amount,ipca:x.ipca,spread:x.lciSpread,du:x.du});\n    const tes=investmentModel({amount:x.amount,ipca:x.ipca,spread:x.treasurySpread,du:x.du,taxed:true,irPct:x.irPct,custodyPct:x.custody,agentPct:x.agentFee});\n    const marketReal=marketRealFor(x.du),marketImp=marketIpcaFor(x.du);\n    const currentVsReal=Number.isFinite(marketReal)?(x.treasurySpread-marketReal)*100:NaN;\n\n    $('v4MarketStrip').innerHTML=`\n      <article><span>Data Tesouro</span><strong>${dateBr(V.dataDate)}</strong><small>snapshot usado</small></article>\n      <article><span>Vencimento</span><strong>${dateBr(x.t.maturity)}</strong><small>${x.du.toLocaleString('pt-BR')} DU · ${approxHorizon(x.du)}</small></article>\n      <article><span>Tesouro · compra</span><strong>IPCA + ${pct(x.treasurySpread,2)}</strong><small>título sem cupom</small></article>\n      <article><span>ANBIMA · juro real</span><strong>${Number.isFinite(marketReal)?`IPCA + ${pct(marketReal,2)}`:'—'}</strong><small>${V.anbimaDate?dateBr(V.anbimaDate):'sem referência'}</small></article>\n      <article><span>IR do Tesouro</span><strong>${pct(x.irPct,1)}</strong><small>${Number.isFinite(x.days)?x.days.toLocaleString('pt-BR'):'—'} dias corridos · ${irBracketLabel(x.days)}</small></article>\n      <article><span>Tesouro − ANBIMA</span><strong class=\"${currentVsReal>1?'v4Positive':currentVsReal<-1?'v4Negative':'v4Neutral'}\">${bps(currentVsReal)}</strong><small>mesmo DU · riscos/fluxos diferentes</small></article>`;\n\n    const lciLead=lci.net>=tes.net;\n    const diff=Math.abs(lci.net-tes.net);\n    $('v4ResultGrid').innerHTML=`\n      <article class=\"v4ResultCard ${lciLead?'v4Leader':''}\">\n        <div class=\"v4ResultHead\"><span>LCI IPCA+</span>${lciLead?'<em>maior líquido</em>':''}</div>\n        <strong class=\"v4Rate\">IPCA + ${pct(x.lciSpread,2)}</strong>\n        <div class=\"v4NetValue\">${money(lci.net)}</div>\n        <div class=\"v4MetaList\">\n          <div><span>Valor bruto</span><b>${money(lci.gross)}</b></div>\n          <div><span>IR</span><b>${money(0)} · isenta PF</b></div>\n          <div><span>Taxa nominal modelada</span><b>${pct(lci.nominal,2)}</b></div>\n          <div><span>Retorno real contratado</span><b>${pct(x.lciSpread,2)}</b></div>\n        </div>\n        <small>LCI modelada no mesmo horizonte do Tesouro selecionado. Carência, vencimento, emissor e cobertura FGC precisam ser conferidos na emissão real.</small>\n      </article>\n\n      <article class=\"v4ResultCard ${!lciLead?'v4Leader':''}\">\n        <div class=\"v4ResultHead\"><span>Tesouro IPCA+</span>${!lciLead?'<em>maior líquido</em>':''}</div>\n        <strong class=\"v4Rate\">IPCA + ${pct(x.treasurySpread,2)}</strong>\n        <div class=\"v4NetValue\">${money(tes.net)}</div>\n        <div class=\"v4MetaList\">\n          <div><span>Valor bruto</span><b>${money(tes.gross)}</b></div>\n          <div><span>IR estimado</span><b>${money(tes.tax)} · ${pct(x.irPct,1)}</b></div>\n          <div><span>Custódia/taxas aprox.</span><b>${money(tes.fees)}</b></div>\n          <div><span>Retorno líquido a.a.</span><b>${pct(tes.netAnnual,2)}</b></div>\n        </div>\n        <small>Premissa: levar até o vencimento. Venda antecipada pode gerar resultado diferente por marcação a mercado.</small>\n      </article>\n\n      <article class=\"v4ResultCard v4WinnerCard\">\n        <div class=\"v4ResultHead\"><span>Diferença líquida</span></div>\n        <div class=\"v4Difference\">${money(diff)}</div>\n        <div class=\"v4WinnerName\">${lciLead?'LCI IPCA+':'Tesouro IPCA+'}</div>\n        <div class=\"v4WinnerNote\">maior montante no cenário de IPCA ${pct(x.ipca,2)} e horizonte ${approxHorizon(x.du)}</div>\n      </article>`;\n\n    const treasuryBE=solveTreasurySpread(lci.net,{amount:x.amount,ipca:x.ipca,du:x.du,irPct:x.irPct,custodyPct:x.custody,agentPct:x.agentFee});\n    const lciBE=solveLciSpread(tes.net,{amount:x.amount,ipca:x.ipca,du:x.du});\n    const edge=Number.isFinite(treasuryBE)?(x.treasurySpread-treasuryBE)*100:NaN;\n    $('v4BreakGrid').innerHTML=`\n      <article><span>Tesouro empata com a LCI</span><strong>IPCA + ${pct(treasuryBE,2)}</strong><small>taxa real mínima no modelo, já considerando IR e custos informados</small></article>\n      <article><span>LCI empata com o Tesouro atual</span><strong>IPCA + ${pct(lciBE,2)}</strong><small>taxa real isenta que produziria o mesmo montante líquido</small></article>\n      <article><span>Tesouro atual − equilíbrio</span><strong class=\"${edge>1?'v4Positive':edge<-1?'v4Negative':'v4Neutral'}\">${bps(edge)}</strong><small>${edge>=0?'acima':'abaixo'} da taxa necessária para empatar neste cenário</small></article>`;\n\n    const sentence=lciLead\n      ? `Neste cenário, a <strong>LCI IPCA+ entrega ${money(diff)} a mais</strong> no vencimento, apesar de o Tesouro mostrar uma taxa real de tela ${bps((x.treasurySpread-x.lciSpread)*100)} acima da LCI.`\n      : `Neste cenário, o <strong>Tesouro IPCA+ entrega ${money(diff)} a mais</strong> no vencimento, mesmo após o IR e os custos modelados.`;\n    const ipcaSource=$('v4IpcaMode').value==='market'\n      ? `A inflação usada é a implícita da ANBIMA interpolada no mesmo prazo${Number.isFinite(marketImp)?` (${pct(marketImp,2)})`:''}.`\n      : `A inflação usada foi informada manualmente (${pct(x.ipca,2)}).`;\n    $('v4Reading').innerHTML=`<p><strong>Leitura do cenário.</strong> ${sentence} O Tesouro precisaria estar em aproximadamente <strong>IPCA + ${pct(treasuryBE,2)}</strong> para empatar com a LCI IPCA + ${pct(x.lciSpread,2)} pelas premissas atuais.</p>\n      <p>${ipcaSource} O IR considerado é de <strong>${pct(x.irPct,1)}</strong>, com prazo fiscal aproximado de ${Number.isFinite(x.days)?x.days.toLocaleString('pt-BR'):'—'} dias corridos. Custódia B3: ${pct(x.custody,2)} a.a.; taxa da instituição: ${pct(x.agentFee,2)} a.a.</p>\n      <p class=\"v4Caution\">Resultado modelado não equivale a recomendação. Liquidez, carência, risco de crédito, concentração, FGC, risco soberano, objetivo do cliente e eventual venda antecipada podem ser mais relevantes que a diferença financeira estimada.</p>`;\n\n    renderSensitivity(x);\n    renderRateConverter();\n  }\n\n  function renderSensitivity(x){\n    const values=[3,4,5,6,7,8,x.ipca]\n      .filter(Number.isFinite)\n      .map(v=>Math.round(v*100)/100)\n      .filter((v,i,a)=>a.indexOf(v)===i)\n      .sort((a,b)=>a-b);\n    $('v4Sensitivity').innerHTML=values.map(ipca=>{\n      const lci=investmentModel({amount:x.amount,ipca,spread:x.lciSpread,du:x.du});\n      const be=solveTreasurySpread(lci.net,{amount:x.amount,ipca,du:x.du,irPct:x.irPct,custodyPct:x.custody,agentPct:x.agentFee});\n      const diff=(x.treasurySpread-be)*100;\n      const current=investmentModel({amount:x.amount,ipca,spread:x.treasurySpread,du:x.du,taxed:true,irPct:x.irPct,custodyPct:x.custody,agentPct:x.agentFee});\n      const winner=current.net>=lci.net?'Tesouro':'LCI';\n      const market=Math.abs(ipca-x.ipca)<.005;\n      return `<tr class=\"${market?'v4MarketRow':''}\"><td>${pct(ipca,2)}${market?' · cenário':''}</td><td>IPCA + ${pct(be,2)}</td><td class=\"${diff>1?'v4Positive':diff<-1?'v4Negative':'v4Neutral'}\">${bps(diff)}</td><td class=\"${winner==='Tesouro'?'v4Positive':'v4Neutral'}\">${winner}</td></tr>`;\n    }).join('');\n  }\n\n  function syncConverterFromTreasury(){\n    const x=currentInputs();\n    if(!Number.isFinite(x.days)) return;\n    if($('v4ConvDays')) $('v4ConvDays').value=String(Math.max(1,Math.round(x.days)));\n    if($('v4ConvCost')) $('v4ConvCost').value=(Math.max(0,x.custody)+Math.max(0,x.agentFee)).toFixed(2);\n    renderRateConverter();\n  }\n\n  function renderRateConverter(){\n    const host=$('v4ConvResult');\n    if(!host) return;\n    const direction=$('v4ConvDirection')?.value||'exemptToTaxed';\n    const rate=num('v4ConvRate'),days=num('v4ConvDays'),cost=num('v4ConvCost');\n    const years=Number.isFinite(days)?days/365.25:NaN;\n    const ir=irRateByCalendarDays(days);\n    const result=direction==='exemptToTaxed'\n      ? solveTaxableEquivalent(rate,years,ir,cost)\n      : solveExemptEquivalent(rate,years,ir,cost);\n    const sourceLabel=direction==='exemptToTaxed'?'Taxa isenta':'Taxa tributável bruta';\n    const resultLabel=direction==='exemptToTaxed'?'Taxa tributável bruta equivalente':'Taxa isenta equivalente';\n    const rateLabel=$('v4ConvRateLabel');\n    if(rateLabel){\n      const textNode=[...rateLabel.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);\n      if(textNode) textNode.nodeValue=(direction==='exemptToTaxed'?'Taxa isenta de origem':'Taxa tributável de origem')+'\\n            ';\n    }\n    host.innerHTML=`\n      <article><span>${sourceLabel}</span><strong>${pct(rate,2)} a.a.</strong><small>taxa informada</small></article>\n      <article class=\"v4ConvMain\"><span>${resultLabel}</span><strong>${pct(result,2)} a.a.</strong><small>equivalência pelo montante líquido no prazo</small></article>\n      <article><span>IR automático</span><strong>${pct(ir,1)}</strong><small>${irBracketLabel(days)}</small></article>\n      <article><span>Prazo usado</span><strong>${Number.isFinite(days)?Math.round(days).toLocaleString('pt-BR'):'—'} dias</strong><small>${Number.isFinite(years)?years.toLocaleString('pt-BR',{maximumFractionDigits:2}):'—'} anos · custo ${pct(cost,2)} a.a.</small></article>`;\n\n    document.querySelectorAll('#v4IrGrid article').forEach(card=>{\n      const max=+card.dataset.irMax;\n      const active=(days<=180&&max===180)||(days>180&&days<=360&&max===360)||(days>360&&days<=720&&max===720)||(days>720&&max>720);\n      card.classList.toggle('active',active);\n    });\n  }\n\n  function bind(){\n    $('v4TreasuryTitle')?.addEventListener('change',()=>{syncSelected();syncConverterFromTreasury();render();});\n    $('v4IpcaMode')?.addEventListener('change',()=>{syncIpcaMode();render();});\n    ['v4Amount','v4LciSpread','v4Ipca','v4Custody','v4AgentFee'].forEach(id=>{\n      $(id)?.addEventListener('input',()=>{\n        if(id==='v4Ipca'&&$('v4IpcaMode')?.value==='market') return;\n        render();\n      });\n      $(id)?.addEventListener('change',()=>{\n        if(id==='v4Amount') formatMoneyInput($(id));\n        render();\n      });\n    });\n    const amount=$('v4Amount');\n    if(amount){\n      amount.addEventListener('blur',()=>{formatMoneyInput(amount);render();});\n      amount.addEventListener('focus',()=>amount.select());\n      formatMoneyInput(amount);\n    }\n    ['v4ConvDirection','v4ConvRate','v4ConvDays','v4ConvCost'].forEach(id=>{\n      $(id)?.addEventListener('input',renderRateConverter);\n      $(id)?.addEventListener('change',renderRateConverter);\n    });\n    $('v4ConvUseTreasury')?.addEventListener('click',syncConverterFromTreasury);\n  }\n\n  function v4Copy(){\n    document.title='Juros Brasil · V4.1.0 Teste';\n    const build=document.querySelector('.v3Build');\n    if(build){build.className='v4Build';build.textContent=VERSION;}\n    const intro=$('tab-decisao')?.querySelector('.decisionIntro');\n    if(intro){\n      const h=intro.querySelector('h2');\n      const sub=intro.querySelector('.sectionSubtitle');\n      if(h) h.textContent='LCI × Tesouro × cenários de renda fixa';\n      if(sub) sub.textContent='Compare estruturas no mesmo prazo, em valor líquido, sem perder as referências de curva, histórico, liquidez e risco.';\n    }\n    const summary=document.querySelector('.v31SummaryCardDecision strong');\n    if(summary) summary.textContent='LCI × Tesouro × cenários';\n  }\n\n  async function boot(){\n    try{\n      buildModule();\n      v4Copy();\n      await loadMarketData();\n      syncSelected();\n      bind();\n      syncConverterFromTreasury();\n      render();\n    }catch(err){\n      const host=$('v4Reading');\n      if(host) host.innerHTML=`<p><strong>Não foi possível iniciar o comparador V4.</strong> ${String(err?.message||err)}</p>`;\n      console.error('[V4]',err);\n    }\n  }\n\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);\n  else boot();\n})();\n";
        html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>Juros Brasil · V4.1.0 Teste</title>');
        html=html.replace('</head>',`<style>${css}</style>\n</head>`);
        html=html.replace('</body>',`<script>${js}<\/script>\n</body>`);
        document.open();

      }
    })();
