<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Juros Brasil V4 · comparador líquido LCI IPCA+ × Tesouro IPCA+.">
  <title>Juros Brasil · V4.0.1 Teste</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07121d;color:#eaf2fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .v4Loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .v4Loader strong{display:block;font-size:1.1rem}.v4Loader span{display:block;margin-top:8px;color:#9fb2c6;font-size:.86rem;max-width:720px}
  </style>
</head>
<body>
  <div class="v4Loader"><div><strong>Carregando Juros Brasil · V4</strong><span>Base V3 + comparador LCI IPCA+ × Tesouro IPCA+</span></div></div>
  <script>
    (async()=>{
      try{
        const r=await fetch('./v3.html',{cache:'no-store'});
        if(!r.ok)throw new Error(`v3.html: HTTP ${r.status}`);
        let html=await r.text();
        html=html.replace(/<title>[\s\S]*?<\/title>/i,'<title>Juros Brasil · V4.0.1 Teste</title>');
        html=html.replace('</head>','  <link rel="stylesheet" href="css/v4.css?v=4.0.1">\n</head>');
        html=html.replace('</body>','  <script src="js/v4.js?v=4.0.1" defer><\/script>\n</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML=`<div class="v4Loader"><div><strong>Não foi possível carregar a V4.</strong><span>${String(err?.message||err)} · confirme que v4.html está na mesma pasta do v3.html e que css/v4.css e js/v4.js foram enviados.</span></div></div>`;
      }
    })();
  </script>
</body>
</html>
